<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.author }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
</head>
<body>

  <nav class="nav">
    <div class="container nav__inner">
      <a href="{{ '/' | relative_url }}" class="nav__logo">
        {{ site.author | default: "YOUR_NAME" }}
      </a>
      <ul class="nav__links">
        <li><a href="{{ '/#about' | relative_url }}">About</a></li>
        <li><a href="{{ '/#skills' | relative_url }}">Skills</a></li>
        <li><a href="{{ '/writeups/' | relative_url }}">Write-ups</a></li>
        <li><a href="{{ '/#contact' | relative_url }}">Contact</a></li>
      </ul>
    </div>
  </nav>

  <main>
    {{ content }}
  </main>

  <footer class="footer">
    <div class="container">
      <p>© {{ 'now' | date: "%Y" }} {{ site.author | default: "YOUR_NAME" }} &nbsp;·&nbsp; Built with Jekyll &amp; GitHub Pages</p>
    </div>
  </footer>

  <script>
(function () {
  function wrapBlock(el, lang) {
    if (el.closest('.terminal-code')) return;
    var wrapper = document.createElement('div');
    wrapper.className = 'terminal-code';
    el.parentNode.insertBefore(wrapper, el);

    var header = document.createElement('div');
    header.className = 'terminal-code__header';
    header.innerHTML =
      '<span class="terminal-code__dots"><i></i><i></i><i></i></span>' +
      '<span class="terminal-code__lang">' + lang + '</span>' +
      '<button class="terminal-code__copy" type="button">Copy</button>';

    wrapper.appendChild(header);
    wrapper.appendChild(el);

    header.querySelector('.terminal-code__copy').addEventListener('click', function () {
      var codeEl = el.querySelector('code') || el;
      navigator.clipboard.writeText(codeEl.innerText).then(function () {
        var btn = header.querySelector('.terminal-code__copy');
        btn.textContent = 'Copied';
        setTimeout(function () { btn.textContent = 'Copy'; }, 1400);
      });
    });
  }

  document.querySelectorAll('.post-content div.highlighter-rouge').forEach(function (block) {
    var m = block.className.match(/language-([\w+-]+)/);
    wrapBlock(block, m ? m[1] : 'code');
  });

  document.querySelectorAll('.post-content pre').forEach(function (pre) {
    if (pre.closest('.terminal-code') || pre.closest('.highlighter-rouge')) return;
    wrapBlock(pre, 'code');
  });
})();
</script>

</body>
</html>
