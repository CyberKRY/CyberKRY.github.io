<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.author }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
</head>
<body>

  <nav class="nav">
    <div class="container nav__inner">
      <a href="{{ '/' | relative_url }}" class="nav__logo">
        <img src="{{ '/assets/img/logo.png' | relative_url }}" alt="logo" style="height:28px;">
      </a>
      <ul class="nav__links">
        <li><a href="{{ '/#about' | relative_url }}">About</a></li>
        <li><a href="{{ '/#skills' | relative_url }}">Skills</a></li>
        <li><a href="{{ '/writeups/' | relative_url }}">Write-ups</a></li>
        <li><a href="{{ '/#contact' | relative_url }}">Contact</a></li>
      </ul>
    </div>
  </nav>

  <main>
    {{ content }}
  </main>

  <footer class="footer">
    <div class="container">
      <p>© {{ 'now' | date: "%Y" }} {{ site.author | default: "YOUR_NAME" }} &nbsp;·&nbsp; Built with Jekyll &amp; GitHub Pages</p>
    </div>
  </footer>

</body>
</html>
