title: "CyberKRY | Cybersecurity"
description: "Penetration Tester & Security Researcher"
author: "CyberKRY"
email: "CyberKRY@proton.me"
github_username: "CyberKRY"

url: "https://CyberKRY.github.io"
baseurl: ""

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
